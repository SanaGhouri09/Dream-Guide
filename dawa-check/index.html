<link rel="stylesheet" href="assets/site.css">
<style>
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:20px 0 56px;position:relative}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.4vw,62px);line-height:1.06;letter-spacing:-.035em;margin:0 0 20px;text-transform:none}
.hero h1 span{display:block}
.hero p.lede{font-size:17.5px;line-height:1.6;color:var(--soft);max-width:44ch;margin:0 0 24px}
.facts{display:flex;gap:22px;flex-wrap:wrap;font-size:14.5px;color:var(--soft)}
.facts b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.float{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float svg{position:absolute;opacity:.9}
.hero>*:not(.float){position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){
  .float svg{animation:drift 9s ease-in-out infinite alternate}
  .float svg:nth-child(2){animation-duration:11s;animation-delay:-3s}
  .float svg:nth-child(3){animation-duration:13s;animation-delay:-6s}
  @keyframes drift{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-18px) rotate(calc(var(--r,0deg) + 14deg))}}
}

/* capsule switch */
.capsule{display:grid;grid-template-columns:1fr 1fr;border-radius:999px;overflow:hidden;border:2px solid var(--ink);margin-bottom:18px;box-shadow:var(--shadow)}
.capsule button{border:0;padding:13px 10px;font-family:var(--display);font-weight:750;font-size:17px;background:var(--panel);color:var(--soft);transition:background .2s,color .2s}
.capsule button[aria-selected="true"]{background:var(--rx);color:#fff}
:root[data-theme="dark"] .capsule button[aria-selected="true"]{color:#120B2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .capsule button[aria-selected="true"]{color:#120B2A}}
.capsule button+button{border-left:2px solid var(--ink)}

/* carton */
.carton{background:var(--panel);border-radius:4px 4px 18px 18px;box-shadow:var(--shadow);position:relative;overflow:visible}
.carton::before{content:"";display:block;height:14px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,var(--rx) 0 62%,var(--or) 62% 100%)}
.cbody{padding:20px 20px 22px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.chead h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.02em;margin:0}
.chead small{display:block;font-size:13.5px;color:var(--soft);margin-top:4px;font-family:var(--sans)}
.rx{font-family:var(--display);font-weight:800;font-size:22px;color:var(--rx);border:2px solid var(--rx);border-radius:8px;padding:0 7px;line-height:1.35}
.perf{height:0;border-top:2px dashed var(--line);margin:0 -20px 16px}
.strip{position:relative;border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;background:repeating-linear-gradient(0deg,transparent 0 30px,rgba(35,48,143,.035) 30px 31px);overflow:hidden}
.row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;padding:8px 0}
.row+.row{border-top:1px dashed var(--line)}
.row label{font-family:var(--sans);font-weight:600;color:var(--soft);font-size:14px}
.row input{border:0;background:transparent;width:100%;min-width:0;padding:6px 0;outline:none}
.row input.dot{font-family:var(--dot);font-size:24px;color:var(--ink-dot);letter-spacing:.08em;text-transform:uppercase}
.row input.txt{font-size:18px}
.row input::placeholder{color:var(--soft);opacity:.55}
.strip:focus-within{border-color:var(--ink-dot)}
.strip.scanning::after{content:"";position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(180deg,transparent,rgba(106,79,214,.28),transparent);border-bottom:2px solid var(--rx2)}
@media (prefers-reduced-motion:no-preference){.strip.scanning::after{animation:scan .75s ease-in-out}@keyframes scan{to{top:100%}}}
.help{display:flex;gap:8px;align-items:center;margin:12px 0 4px;background:none;border:0;padding:0;color:var(--rx);font-size:15px;font-weight:700}
.where{display:none;margin-top:10px;background:var(--rxbg);border-radius:12px;padding:12px;font-size:14.5px;color:var(--ink)}
.where.on{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.cta{width:100%;margin-top:16px;border:0;border-radius:999px;padding:15px;background:var(--or);color:var(--on-or);box-shadow:0 8px 20px -10px rgba(42,22,112,.45);font-family:var(--display);font-weight:800;font-size:19px;display:flex;justify-content:center;align-items:center;gap:10px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:14px;color:var(--soft);align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px}
.chip:hover{border-color:var(--rx)}

.vx{grid-column:1/-1}
.acts{margin-top:4px;display:grid;gap:8px}
.acts-h{margin:0;font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink)}
.act{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px;font-weight:700}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:16px}
.act .num{margin-left:auto;white-space:nowrap;font-family:var(--display);font-size:18px}
.draft summary{cursor:pointer;color:var(--ink-dot);font-weight:700;font-size:15px;padding:4px 0}
.draft textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:14.5px;resize:vertical}
.draft .copy{margin-top:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--rx);color:#fff;font-weight:700;font-size:14px}
.keep{margin:2px 0 0;font-size:13.5px;color:var(--soft)}
.wa{display:inline-flex;gap:6px;align-items:center;color:#1A8F49;font-weight:700;font-size:14px;text-decoration:none;justify-self:start}
/* scan */
.scanbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--rx);background:var(--rxbg);color:var(--rx);border-radius:14px;padding:14px;font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:12px}
.scanbtn small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--soft);}
.scanbtn .cam{width:40px;height:40px;border-radius:50%;background:var(--rx);display:grid;place-items:center;flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px;margin:0 0 12px}
.or::before,.or::after{content:"";flex:1;border-top:1px dashed var(--line)}
.scanstat{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14.5px}
.scanstat img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.scanstat .sp{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--rx);flex:none}
@media (prefers-reduced-motion:no-preference){.scanstat .sp{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

/* stamp */
.stamp{position:absolute;right:14px;top:26px;transform:rotate(-9deg) scale(1);font-family:var(--display);font-weight:800;font-size:22px;line-height:1;padding:8px 12px;border:3px double currentColor;border-radius:8px;letter-spacing:.02em;background:var(--panel);opacity:0;pointer-events:none;max-width:60%;text-align:center}
.stamp.show{opacity:.95}
@media (prefers-reduced-motion:no-preference){.stamp.show{animation:thud .38s cubic-bezier(.2,1.6,.4,1)}@keyframes thud{from{opacity:0;transform:rotate(-9deg) scale(1.9)}}}
.stamp.red{color:var(--red)} .stamp.amber{color:var(--amber)} .stamp.green{color:var(--rx)}

/* autocomplete */
.ac{position:relative}
.list{position:absolute;left:-14px;right:-14px;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;padding:6px;display:none;max-height:300px;overflow:auto}
.list.on{display:block}
.list button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-size:16px}
.list button small{color:var(--soft);font-size:13px;display:block}
.list button[aria-selected="true"],.list button:hover{background:var(--rxbg)}

/* results */
.results{display:grid;gap:12px;margin-top:18px}
.verdict{border-radius:16px;padding:18px;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.verdict .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;font-family:var(--display)}
.verdict h3{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.15;margin:2px 0 6px}
.verdict p{margin:0;font-size:15.5px}
.v-red{background:var(--redbg)} .v-red .ic{background:var(--red)} .v-red h3{color:var(--red)}
.v-amber{background:var(--amberbg)} .v-amber .ic{background:var(--amber)} .v-amber h3{color:var(--amber)}
.v-green{background:var(--rxbg)} .v-green .ic{background:var(--rx)} .v-green h3{color:var(--rx)}
.item{background:var(--panel);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.item b{font-size:16.5px}
.tag{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-fake{background:var(--redbg);color:var(--red)} .t-sub{background:var(--amberbg);color:var(--amber)} .t-other{background:var(--foil1);color:var(--soft)}
.meta{font-size:14.5px;color:var(--soft);margin-top:5px}
.meta a{color:var(--ink-dot)}
.bn{font-family:var(--dot);color:var(--ink-dot)}

/* blister / price */
.blister{display:grid;gap:10px}
.pack{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(135deg,var(--foil1),var(--panel) 60%);border-radius:14px;padding:12px}
.pack .cell{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--foil2));box-shadow:inset 0 -3px 6px rgba(0,0,0,.12);display:grid;place-items:center}
.pack .cell i{width:28px;height:13px;border-radius:7px;background:linear-gradient(90deg,var(--rx) 50%,var(--or) 50%);display:block;transform:rotate(-30deg);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pack .nm b{display:block;font-size:16px;line-height:1.25}
.pack .nm small{color:var(--soft);font-size:13.5px}
.sticker{font-family:var(--display);font-weight:800;font-size:18px;background:var(--or);color:var(--on-or);padding:6px 10px;border-radius:6px;transform:rotate(2deg);white-space:nowrap}
.pack[aria-pressed="true"]{border-color:var(--rx);box-shadow:0 0 0 2px var(--rx)}
.paybox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:-2px}
.payrow{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.payrow span{font-family:var(--display);font-weight:800;font-size:26px;color:var(--soft)}
.payrow input{border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:34px;width:100%;outline:none}
.meter{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--rx) 0 var(--lim),var(--red) var(--lim) 100%);margin:22px 0 8px;opacity:.9}
.meter .pin{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--panel);border:4px solid var(--ink);transform:translate(-50%,-50%);left:var(--pos);transition:left .25s}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}

/* latest */
section.latest{padding:40px 0 10px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
.sh h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.03em;margin:0}
.sh p{margin:0;color:var(--soft);font-size:15px;max-width:36ch}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,250px);gap:14px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x mandatory}
.box{scroll-snap-align:start;position:relative;background:var(--panel);border-radius:4px 4px 14px 14px;box-shadow:var(--shadow);padding:16px 16px 14px;text-align:left;border:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:200px}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--rx) 0 60%,var(--or) 60%)}
.box .tape{position:absolute;right:-38px;top:26px;transform:rotate(35deg);background:var(--tape);color:#fff;font-family:var(--display);font-weight:800;font-size:13px;padding:4px 44px;letter-spacing:.04em}
.box b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;margin-top:12px;padding-right:40px}
.box .bn{font-size:17px}
.box small{color:var(--soft);font-size:13.5px;margin-top:auto}
.box .go{color:var(--rx);font-weight:700;font-size:14px}

/* grouped price results */
.groups{display:grid;gap:12px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.g-head{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.g-ic{width:44px;height:44px;border-radius:12px;background:var(--rxbg);display:grid;place-items:center}
.g-nm b{display:block;font-size:17px;line-height:1.25}
.g-nm small{color:var(--soft);font-size:13px}
.g-ct{font-size:12.5px;font-weight:700;color:var(--rx);background:var(--rxbg);border-radius:999px;padding:3px 10px;white-space:nowrap}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;font-weight:600;color:var(--ink);min-height:40px}
.vchip[aria-pressed="true"]{border-color:var(--rx);background:var(--rxbg);color:var(--rx)}
.packs{display:grid;gap:8px}
.comp{margin:0;font-size:13px;color:var(--soft)}
.pack .cell{background:var(--rxbg)!important;box-shadow:none!important}
/* install */
.install{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 12px;box-shadow:var(--shadow);margin:0 0 14px}
.install img{border-radius:11px}
.itxt b{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.itxt span{font-size:13.5px;color:var(--soft)}
.ibtn{border:0;border-radius:999px;background:var(--or);color:var(--on-or);font-weight:700;padding:9px 14px;font-size:15px}
.ix{border:0;background:transparent;color:var(--soft);font-size:24px;line-height:1;padding:4px 6px}
.ios{grid-column:1/-1;background:var(--rxbg);border-radius:10px;padding:10px 12px;font-size:14.5px}
@media (prefers-reduced-motion:no-preference){.install:not(.hidden){animation:rise .35s ease-out both}}
/* demos */
section.demos{padding:28px 0 6px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.demo{margin:0;background:linear-gradient(160deg,var(--rxbg),var(--orbg));border-radius:22px;padding:22px}
.demo figcaption{margin-top:14px;font-size:15px;color:var(--ink);font-weight:700}
.screen{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;min-height:228px;display:grid;gap:14px;align-content:start;position:relative;overflow:hidden}
.dm-pack{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:linear-gradient(135deg,var(--foil1),var(--panel) 60%)}
.dm-pack .cell{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--foil2));display:grid;place-items:center}
.dm-pack .cell i{width:24px;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--rx) 50%,var(--or) 50%);transform:rotate(-30deg);display:block}
.dm-pack .nm b{display:block;font-size:15px}.dm-pack .nm small{color:var(--soft);font-size:13px}
.dm-pack .sticker{font-size:16px}
.dm-pay{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px;font-family:var(--display);font-weight:800}
.dm-pay .rs{font-size:22px;color:var(--soft)}
.dm-pay .typed{font-size:30px;display:inline-block;overflow:hidden;white-space:nowrap;width:3.2ch;font-variant-numeric:tabular-nums}
.caret{width:2px;height:26px;background:var(--rx);align-self:center}
.dm-meter{margin:6px 0 0}
.dm-v{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;font-family:var(--display);font-weight:800;font-size:18px}
.dm-v.red{background:var(--redbg);color:var(--red)}
.dm-v .ic{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.dm-box{position:relative;border-radius:4px 4px 14px 14px;border:1px solid var(--line);padding:22px 14px 14px;display:grid;gap:10px}
.dm-box::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,var(--rx) 0 62%,var(--or) 62%);border-radius:4px 4px 0 0}
.dm-strip{position:relative;display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;overflow:hidden}
.dm-strip .lbl{font-family:var(--sans);font-weight:600;color:var(--soft);font-size:13px;width:52px}
.typed2{font-family:var(--dot);color:var(--ink-dot);font-size:22px;letter-spacing:.08em;display:inline-block;overflow:hidden;white-space:nowrap;width:7.6ch}
.nmtxt{font-size:16px}
.beam{position:absolute;left:0;right:0;top:-40px;height:40px;background:linear-gradient(180deg,transparent,rgba(255,210,63,.5),transparent);border-bottom:2px solid var(--or);opacity:0}
.dm-stamp{position:absolute;right:12px;bottom:-6px;transform:rotate(-9deg);font-family:var(--display);font-weight:800;font-size:22px;color:var(--red);border:3px double var(--red);border-radius:8px;padding:6px 10px;background:var(--panel)}
@media (prefers-reduced-motion:no-preference){
  .dm-pay .typed{animation:typ 6s steps(3,end) infinite}
  @keyframes typ{0%,12%{width:0}30%,88%{width:3.2ch}100%{width:0}}
  .caret{animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .dm-meter .pin{animation:pin 6s ease-in-out infinite}
  @keyframes pin{0%,30%{left:0%}45%,88%{left:82%}100%{left:0%}}
  .dm-v{animation:pop 6s ease-out infinite}
  @keyframes pop{0%,46%{opacity:0;transform:translateY(8px) scale(.96)}52%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
  .typed2{animation:typ2 6s steps(7,end) infinite}
  @keyframes typ2{0%,8%{width:0}34%,88%{width:7.6ch}100%{width:0}}
  .beam{animation:beam 6s ease-in-out infinite}
  @keyframes beam{0%,38%{top:-40px;opacity:0}40%{opacity:1}52%{top:100%;opacity:1}53%,100%{opacity:0;top:100%}}
  .dm-stamp{animation:stamp 6s cubic-bezier(.2,1.6,.4,1) infinite}

/* autocomplete */
function autocomplete(input,list,source,onPick){
  let idx=-1,items=[];
  const close=()=>{list.classList.remove("on");input.setAttribute("aria-expanded","false");idx=-1};
  input.addEventListener("input",()=>{
    const q=low(input.value);if(q.length<2){close();return}
    const st=[],ct=[];
    for(const n of source){const l=low(n);if(l.startsWith(q))st.push(n);else if(ct.length<20&&l.includes(q))ct.push(n);if(st.length>=8)break}
    items=[...st,...ct].slice(0,7);
    if(!items.length){close();return}
    list.innerHTML=items.map((n,i)=>`<button type="button" role="option" id="${list.id}-${i}" aria-selected="false">${esc(n)}</button>`).join("");
    list.classList.add("on");input.setAttribute("aria-expanded","true");
    list.querySelectorAll("button").forEach((b,i)=>b.onmousedown=e=>{e.preventDefault();input.value=items[i];close();onPick&&onPick()});
  });
  input.addEventListener("keydown",e=>{
    if(!list.classList.contains("on"))return;
    const bs=list.querySelectorAll("button");
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();idx=(idx+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.setAttribute("aria-selected",i===idx));input.setAttribute("aria-activedescendant",bs[idx].id)}
    else if(e.key==="Enter"&&idx>=0){e.preventDefault();e.stopImmediatePropagation();input.value=items[idx];close();onPick&&onPick()}
    else if(e.key==="Escape")close();
  });
  input.addEventListener("blur",()=>setTimeout(close,120));
}

function runBatch(silent){
  state="b";
  const qbRaw=$("qb").value.trim(),qb=norm(qbRaw),qnRaw=$("qn").value.trim(),qn=low(qnRaw),out=$("res");
  if(!qb&&qn.length<3){out.innerHTML=verdict("v-amber","!",T[L].needInput,T[L].needInputP);hideStamp();return}
  const words=qn?qn.split(" "):[];
  const nameHit=a=>words.every(w=>a._n.includes(w));
  let exact=[],close=[];
  if(qb){ALERTS.forEach(a=>{if(a._b.some(x=>x===qb))exact.push(a);else if(qb.length>=5&&a._b.some(x=>x.length>=5&&(x.includes(qb)||qb.includes(x))))close.push(a)});
    if(qn){const e2=exact.filter(nameHit);if(e2.length)exact=e2;close=close.filter(nameHit)}}
  const byName=qn.length>=3?ALERTS.filter(nameHit):[];
  const label=[qnRaw,qbRaw&&("batch "+qbRaw)].filter(Boolean).join(", ");
  const render=()=>{
    let h,st;
    if(exact.length){h=verdict("v-red","!",T[L].hitTitle,T[L].hitBody,actions("batch",T[L].draftBatch.replace("__N__",exact[0].p).replace("__B__",exact[0].b||qbRaw).replace("__K__",T[L].kind[exact[0].k]).replace("__D__",fmtDate(exact[0].d)).replace("__T__",today()),`⚠️ ${label}: ${T[L].hitTitle}. ${T[L].kind[exact[0].k]} (${fmtDate(exact[0].d)})`))+exact.map(alertCard).join("");st=["red",T[L].stampHit]}
    else if(close.length){h=verdict("v-amber","?",T[L].closeTitle,T[L].closeBody)+close.slice(0,10).map(alertCard).join("");st=["amber",T[L].stampClose]}
    else if(qb&&byName.length){h=verdict("v-amber","?",T[L].nameTitle,T[L].nameBody)+byName.slice(0,15).map(alertCard).join("");st=["green",T[L].stampClear]}
    else if(!qb&&byName.length){h=verdict("v-amber","i",T[L].nameOnlyTitle,T[L].nameOnlyBody)+byName.slice(0,15).map(alertCard).join("");st=null}
    else{h=verdict("v-green","✓",T[L].clearTitle,fill(T[L].clearBody));st=qb?["green",T[L].stampClear]:null}
    out.innerHTML=h; st?showStamp(st[0],st[1]):hideStamp();
    if(!silent)DC.track("batch_check",{result:exact.length?"alert":close.length?"close_match":byName.length?"name_only":"clear",medicine:qnRaw.slice(0,80)});
  };
  if(silent){render();return}
  const strip=$("stripB");strip.classList.remove("scanning");void strip.offsetWidth;strip.classList.add("scanning");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{strip.classList.remove("scanning");render();if(innerWidth<860)out.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"})},reduce?0:650);
}

function formOf(r){
  const t=(r[0]+" "+r[1]+" "+r[3]).toLowerCase();
  if(/inhal|respule|rotacap|evohaler|accuhaler|nebul/.test(t))return"inhaler";
  if(/inj|vial|ampoul|infusion|\bi\.?v\b|prefilled|pre-filled|syringe/.test(t))return"inj";
  if(/drop/.test(t))return"drops";
  if(/syrup|susp|elixir|linctus|liquid|oral sol|solution|dry powder for|\bml\b/.test(t))return"syrup";
  if(/cream|ointment|\boint\b|\bgel\b|lotion|paste|\bspray\b/.test(t))return"cream";
  if(/sachet|granule|powder/.test(t))return"sachet";
  if(/caps|capsule|\bcap\b/.test(t))return"capsule";
  if(/tab|caplet|\bdt\b/.test(t))return"tablet";
  return"other";
}
const STR=/\d+(?:\.\d+)?\s*(?:mg|mcg|µg|g|ml|iu|%)(?:\s*\/\s*\d*\s*(?:ml|g))?/i;
function baseOf(b){
  let s=b.replace(/[®™]/g,"").replace(/\(.*?\)/g," ");
  s=s.replace(/\s*\d+(?:\.\d+)?\s*(?:mg|mcg|µg|g|ml|iu|%)\b.*$/i,"");
  s=s.replace(/\s(?:tablets?|tabs?|caplets?|capsules?|caps?|syrup|suspension|susp|elixir|drops?|injection|inj|infusion|cream|ointment|gel|lotion|sachets?|granules|powder|ds|forte|plus|xr|sr|er|mr|cr|dt|extra|extend|max|kids?|junior|pediatric|paediatric|liquid|retard|i\.?v\.?|\d+)(?:\b|\s|$).*$/i,"");
  s=s.replace(/[-.,]+$/,"").trim();
  return s||b.split(/\s+/)[0];
}
const tcase=s=>s.toLowerCase().replace(/(^|\s|-)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function variantLabel(r,base){
  let rest=r[0].replace(/[®™]/g,"");
  const i=rest.toLowerCase().indexOf(base.toLowerCase());
  if(i>=0)rest=rest.slice(i+base.length);
  rest=rest.replace(/^[\s\-–,.]+/,"").trim();
  rest=rest&&rest===rest.toUpperCase()?tcase(rest):rest;
  if(!STR.test(rest)){const all=(r[1]||"").match(new RegExp(STR.source,"gi"))||[];const m=all.find(x=>!/ml$/i.test(x.trim()))||all[0];if(m)rest=(rest?rest+" ":"")+m.replace(/\s+/g,"")}
  rest=rest.charAt(0).toUpperCase()+rest.slice(1);
  rest=rest.replace(/\b(ds|xr|sr|cr|mr|er|dt|iv|i\.v\.)\b/gi,x=>x.toUpperCase());
  return rest||T[L].standard;
}
function runPrice(silent){
  state="p";hideStamp();
  const q=low($("qp").value),out=$("res");
  if(q.length<3){out.innerHTML=verdict("v-amber","!",T[L].needInput,"");return}
  const w=q.split(" ");
  const rows=PRICES.filter(r=>w.every(x=>r._n.includes(x)));
  if(!silent)DC.track("price_search",{term:q.slice(0,80),results:rows.length});
  if(!rows.length){out.innerHTML=verdict("v-amber","i",T[L].priceNone,T[L].priceNoneBody)+mrpBox();wireMrp();return}
  const gm=new Map();
  for(const r of rows){
    const base=baseOf(r[0]),key=low(base)+"|"+low(r[2]).replace(/\b(pvt|private|ltd|limited|pakistan|pak)\b/g,"").replace(/\s+/g," ").trim();
    if(!gm.has(key))gm.set(key,{base,maker:r[2],vars:new Map()});
    const g=gm.get(key),vk=low(r[0])+"|"+low(r[1]);
    if(!g.vars.has(vk))g.vars.set(vk,{label:variantLabel(r,base),form:formOf(r),comp:r[1],rows:[]});
    g.vars.get(vk).rows.push(r);
  }
  groups=[...gm.values()].map(g=>{
    const vars=[...g.vars.values()];
    vars.forEach(v=>v.rows.sort((a,b)=>a[4]-b[4]));
    vars.sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}));
    const forms=[...new Set(vars.map(v=>v.form))];
    return{base:g.base,maker:g.maker,vars,form:forms[0],sel:0};
  });
  groups.sort((a,b)=>(low(a.base).startsWith(w[0])?0:1)-(low(b.base).startsWith(w[0])?0:1)||b.vars.length-a.vars.length||a.base.localeCompare(b.base));
  groups=groups.slice(0,15);
  hits=[];
  out.innerHTML=`<p class="meta" style="margin:0">${T[L].pickPack}</p><div class="groups">${groups.map((g,gi)=>`
   <article class="grp"><div class="g-head"><span class="g-ic">${ficon(g.form,30)}</span><span class="g-nm"><b>${esc(tcase(g.base))}</b><small>${esc(g.maker)}</small></span><span class="g-ct">${g.vars.length} ${g.vars.length>1?T[L].variants:T[L].variant}</span></div>
   <div class="vchips" role="group" aria-label="${T[L].chooseVar}">${g.vars.map((v,vi)=>`<button class="vchip" data-g="${gi}" data-v="${vi}" aria-pressed="${vi===0}">${ficon(v.form,18)}<span>${esc(v.label)}</span></button>`).join("")}</div>
   <div class="packs" id="packs${gi}"></div></article>`).join("")}</div>`;
  groups.forEach((g,gi)=>renderPacks(gi,0));
  out.querySelectorAll(".vchip").forEach(b=>b.onclick=()=>{const gi=+b.dataset.g,vi=+b.dataset.v;out.querySelectorAll(`.vchip[data-g="${gi}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));renderPacks(gi,vi)});
  out.insertAdjacentHTML("beforeend",`<button class="chip" id="notListed" style="justify-self:start">${T[L].notListed}</button><div id="mrpWrap"></div>`);
  $("notListed").onclick=()=>{out.querySelectorAll(".pay").forEach(x=>{x.classList.add("hidden");x.innerHTML=""});out.querySelectorAll(".pack").forEach(x=>x.setAttribute("aria-pressed","false"));$("mrpWrap").innerHTML=verdict("v-amber","i",T[L].priceNone,T[L].priceNoneBody)+mrpBox();wireMrp();$("mrp").focus()};
}
function renderPacks(gi,vi){
  const v=groups[gi].vars[vi],box=$("packs"+gi);
  box.innerHTML=(v.comp?`<p class="comp">${esc(v.comp.slice(0,110))}</p>`:"")+v.rows.map(r=>{const i=hits.push(r)-1;return`<div><button class="pack" data-i="${i}" aria-pressed="false"><span class="cell">${ficon(v.form,26)}</span><span class="nm"><b>${esc(r[3]||"Pack")}</b><small>${T[L].regNo} ${esc(r[6])} · ${T[L].since} ${esc(r[5])}</small></span><span class="sticker">Rs ${rs(r[4])}</span></button><div class="pay hidden" id="pay${i}"></div></div>`}).join("");
  box.querySelectorAll(".pack").forEach(b=>b.onclick=()=>openPay(+b.dataset.i));
}
function mrpBox(){return `<div class="paybox"><label for="mrp" class="meta" style="display:block;margin:0 0 6px">${T[L].mrpLbl}</label><div class="payrow"><span>Rs</span><input id="mrp" inputmode="decimal" autocomplete="off" placeholder="0"></div><label for="mpaid" class="meta" style="display:block;margin:16px 0 6px">${T[L].paidLbl}</label><div class="payrow"><span>Rs</span><input id="mpaid" inputmode="decimal" autocomplete="off" placeholder="0"></div><div id="mmeter"></div><div id="mout"></div></div>`}
function wireMrp(){
  const go=()=>{const m=parseFloat($("mrp").value.replace(/[^0-9.]/g,"")),v=parseFloat($("mpaid").value.replace(/[^0-9.]/g,"")),o=$("mout"),mt=$("mmeter");
    if(!(m>0)||!(v>0)){o.innerHTML="";mt.innerHTML="";return}
    const max=Math.max(v,m)*1.25;
    mt.innerHTML=`<div class="meter" style="--lim:${m/max*100}%;--pos:${Math.min(v/max*100,100)}%"><span class="pin"></span></div><div class="meter-l"><span>Rs 0</span><span>${T[L].limit}: Rs ${rs(m)}</span></div>`;
    o.innerHTML=v>m+0.5?`<div style="margin-top:14px">${verdict("v-red","!",T[L].mrpOver.replace("__X__",rs(v-m)),T[L].mrpOverBody.replace("__M__",rs(m)),actions("price",T[L].draftPrice.replace("__N__",$("qp").value).replace("__V__",rs(v)).replace("__M__",rs(m)).replace("__S__",T[L].printedOnBox).replace("__T__",today()),`${$("qp").value}: printed MRP Rs ${rs(m)}, charged Rs ${rs(v)}`))}</div>`:`<div style="margin-top:14px">${verdict("v-green","✓",T[L].mrpOk,T[L].mrpOkBody.replace("__M__",rs(m)))}</div>`};
  $("mrp").addEventListener("input",go);$("mpaid").addEventListener("input",go);
}
function openPay(i){
  const out=$("res");
  out.querySelectorAll(".pack").forEach(x=>x.setAttribute("aria-pressed",x.dataset.i==i));
  out.querySelectorAll(".pay").forEach(x=>{x.classList.add("hidden");x.innerHTML=""});
  const r=hits[i],box=$("pay"+i);box.classList.remove("hidden");
  box.innerHTML=`<div class="paybox"><label for="pv" class="meta" style="display:block;margin:0 0 6px">${T[L].paidLbl}</label><div class="payrow"><span>Rs</span><input id="pv" inputmode="decimal" autocomplete="off" placeholder="0"></div><div id="pmeter"></div><div id="pv-out"></div></div>`;
  const inp=$("pv");inp.focus();
  inp.addEventListener("change",()=>{const v=parseFloat(inp.value.replace(/[^0-9.]/g,""));if(v>0)DC.track("price_compare",{medicine:r[0].slice(0,80),pack:r[3],overcharged:v>r[4]+0.5,over_by:Math.max(0,Math.round(v-r[4]))})});
  inp.addEventListener("input",()=>{
    const v=parseFloat(inp.value.replace(/[^0-9.]/g,"")),o=$("pv-out"),m=$("pmeter");
    if(isNaN(v)||v<=0){o.innerHTML="";m.innerHTML="";return}
    const max=Math.max(v,r[4])*1.25,lim=r[4]/max*100,pos=Math.min(v/max*100,100);
    m.innerHTML=`<div class="meter" style="--lim:${lim}%;--pos:${pos}%"><span class="pin"></span></div><div class="meter-l"><span>Rs 0</span><span>${T[L].limit}: Rs ${rs(r[4])}</span></div>`;
    const md=r[5];
    o.innerHTML=v>r[4]+0.5
      ?`<div style="margin-top:14px">${verdict("v-red","!",T[L].over.replace("__X__",rs(v-r[4])),T[L].overBody.replace("__M__",rs(r[4])).replace("__D__",md),actions("price",T[L].draftPrice.replace("__N__",r[0]+" ("+r[3]+")").replace("__V__",rs(v)).replace("__M__",rs(r[4])).replace("__S__","DRAP ("+md+")").replace("__T__",today()),`${r[0]} (${r[3]}): DRAP price Rs ${rs(r[4])}, charged Rs ${rs(v)}`))}</div>`
      :`<div style="margin-top:14px">${verdict("v-green","✓",T[L].ok,T[L].okBody.replace("__M__",rs(r[4])).replace("__D__",md))}</div>`;
  });
}
$("goP").onclick=()=>runPrice();
$("qp").addEventListener("keydown",e=>{if(e.key==="Enter")runPrice()});
document.querySelectorAll("[data-px]").forEach(c=>c.onclick=()=>{$("qp").value=c.dataset.px;runPrice()});

/* shelf of latest fakes */
function renderShelf(){
  const seen=new Set(),pick=[];
  for(const a of ALERTS){if(a.k!=="fake"||!a.b)continue;const k=short(a.p);if(seen.has(k))continue;seen.add(k);pick.push(a);if(pick.length>=10)break}
  $("shelf").innerHTML=pick.map((a,i)=>`<button class="box" data-s="${i}"><span class="tape">${esc(T[L].kind.fake.toUpperCase())}</span><b>${esc(short(a.p))}</b><span class="bn">B.No ${esc(a.b)}</span><small>${fmtDate(a.d)}</small><span class="go">${T[L].tapCheck} →</span></button>`).join("");
  $("shelf").querySelectorAll(".box").forEach(b=>b.onclick=()=>{const a=pick[+b.dataset.s];setTab("b");$("qn").value=short(a.p);$("qb").value=a.b;$("tool").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>runBatch(),350)});
}
/* ---------- home screen install ---------- */
(()=>{
  const bar=$("install"),btn=$("instBtn"),ios=$("iosHelp");
  const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(!inFrame&&"serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(inFrame||standalone)return;
  let snoozed=false;try{snoozed=Date.now()<+(localStorage.getItem("dc-install-snooze")||0)}catch(e){}
  if(snoozed)return;
  let deferred=null;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const show=()=>bar.classList.remove("hidden");
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show()});
  if(isIOS)setTimeout(show,1500);
  btn.onclick=async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;bar.classList.add("hidden")}
    else ios.classList.toggle("hidden");
  };
  $("instX").onclick=()=>{bar.classList.add("hidden");try{localStorage.setItem("dc-install-snooze",String(Date.now()+14*864e5))}catch(e){}};
  window.addEventListener("appinstalled",()=>bar.classList.add("hidden"));
})();
applyLang();
fromHash();
