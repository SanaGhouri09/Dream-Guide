<link rel="stylesheet" href="assets/site.css">
<style>
/* hero: copy left, scene right */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:24px 64px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.4vw,50px);line-height:1.06;letter-spacing:-.035em;margin:0 0 18px}
.hero h1 span{display:block}
.hero p.lede{font-size:17.5px;line-height:1.6;color:var(--soft);max-width:46ch;margin:0}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-family:var(--display);font-weight:800;font-size:16.5px;text-decoration:none;color:var(--ink);background:var(--panel);border:2px solid var(--ink);transition:transform .12s}
.btn.primary{background:var(--or);border-color:var(--or);color:var(--on-or);box-shadow:0 8px 20px -10px rgba(42,22,112,.45)}
.btn:active{transform:scale(.97)}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;font-size:13.5px;color:var(--soft)}
.trust>span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.trust b{color:var(--ink);font-variant-numeric:tabular-nums}
.eyebrow{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--rx);font-weight:800}

/* stats band */
.stats{background:var(--band);color:var(--band-ink);padding-block:44px}
.st-h{margin:0 0 22px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-soft);font-weight:800}
.st-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.stat{display:flex;flex-direction:column;gap:8px;padding-left:16px;border-left:2px solid var(--band-line)}
.stn{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.4vw,48px);line-height:1;letter-spacing:-.03em;color:var(--band-hi);font-variant-numeric:tabular-nums}
.stat p{margin:0;font-size:15px;line-height:1.5;color:var(--band-ink)}
.src{margin-top:auto;display:inline-flex;align-items:center;gap:5px;color:var(--band-soft);font-size:13px;font-weight:700;text-decoration:none}
.src:hover{color:var(--band-ink);text-decoration:underline}

/* check: visual steps left, tool right */
.check{padding-block:64px 24px}
.check-grid{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1fr);gap:56px;align-items:start}
.proc{position:sticky;top:20px}
.proc h2,.sh h2,.ms-intro h2,.fbt h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.03em;margin:0}
.psteps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:18px;counter-reset:ps}
.psteps li{display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:center;position:relative}
.psteps li:not(:last-child)::after{content:"";position:absolute;left:37px;top:80px;height:14px;border-left:2px dashed var(--line)}
.pic{counter-increment:ps;width:76px;height:76px;border-radius:22px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;position:relative;transition:border-color .25s,background .25s,transform .25s,box-shadow .25s}
.pic::before{content:counter(ps);position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:800;display:grid;place-items:center;transition:background .25s}
.pl{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.2;color:var(--soft);transition:color .25s}
.psteps li.done .pic::before{content:"✓";background:var(--rx);color:#fff}
.psteps li.on .pic{border-color:var(--rx);background:var(--rxbg);transform:scale(1.07);box-shadow:0 10px 24px -12px rgba(75,43,184,.6)}
.psteps li.on .pl,.psteps li.done .pl{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.psteps li.on .pic{animation:ping 1.6s ease-out infinite}@keyframes ping{0%{box-shadow:0 0 0 0 rgba(106,79,214,.45)}70%,100%{box-shadow:0 0 0 14px rgba(106,79,214,0)}}}
.phint{margin:22px 0 0;font-size:14.5px;color:var(--soft);max-width:34ch}

/* complaint ladder */
.refuse{background:var(--panel);border-block:1px solid var(--line);padding-block:60px;margin-top:40px}
.rf-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:ld}
.ladder li{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative}
.lic{width:52px;height:52px;border-radius:16px;background:var(--rxbg);color:var(--rx);display:grid;place-items:center}
.ladder li:nth-child(1) .lic{background:var(--orbg);color:var(--amber)}
.lbody h3{margin:2px 0 4px;font-family:var(--display);font-size:19px;font-weight:800}
.lbody p{margin:0;color:var(--soft);font-size:15px;max-width:52ch}
.lvl{float:right;margin-left:10px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--rx);background:var(--rxbg);border-radius:999px;padding:3px 10px}
.lbtn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border-radius:999px;padding:9px 16px;font-weight:800;font-size:15px;text-decoration:none;border:1.5px solid var(--line);color:var(--ink);background:var(--panel)}
.lbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-family:var(--display);font-size:17px;letter-spacing:.01em}
.proof{background:var(--bg);border:2px dashed var(--line);border-radius:20px;padding:22px;display:grid;gap:14px;position:sticky;top:20px}
.proof h3{margin:0;font-family:var(--display);font-size:20px;font-weight:800}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;font-size:15px}
.chk svg{margin-top:2px}
.fake-q{background:var(--redbg);border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:14.5px}
.fake-q b{color:var(--red)}
.fake-q a{font-weight:700;display:inline-flex;gap:5px;align-items:center}
.fine{margin:0;font-size:13px;color:var(--soft)}

/* missing medicine form */
.missing{padding-block:64px 24px}
.ms-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:48px;align-items:start}
.ms-intro>p:not(.eyebrow){color:var(--soft);font-size:16.5px;max-width:42ch;margin:12px 0 0}
.ms-art{width:200px;max-width:60%;margin:22px 0 6px;display:block}
.ms-pts{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.ms-pts li{font-size:13.5px;font-weight:700;color:var(--rx);background:var(--rxbg);border-radius:999px;padding:5px 12px}
.ms-form{background:var(--panel);border-radius:4px 4px 20px 20px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.ms-form::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,var(--rx) 0 62%,var(--or) 62% 100%)}
.ms-form .full{grid-column:1/-1}
.ms-form .fld:first-child{margin-top:8px}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:13.5px;font-weight:700;color:var(--soft)}
.fld input,.fld textarea{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);outline:none;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--rx)}
.fld input[aria-invalid="true"]{border-color:var(--red)}
.rsin{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding-left:12px}
.rsin:focus-within{border-color:var(--rx)}
.rsin span{font-weight:800;color:var(--soft)}
.rsin input{border:0;background:transparent}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.ms-form .cta{margin-top:4px}
.ms-form .cta[disabled]{opacity:.6;cursor:wait}
.sent{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--rxbg);border-radius:14px;padding:14px}
.sent .ic{width:44px;height:44px;border-radius:50%;background:var(--rx);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.sent b{display:block;font-family:var(--display);font-size:17px}
.sent p{margin:0;font-size:14.5px;color:var(--soft)}

/* feedback teaser */
.fbt{padding-block:40px}
.fbt-in{background:var(--band);color:var(--band-ink);border-radius:24px;padding:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;overflow:hidden}
.fbt-in .eyebrow{color:var(--band-hi)}
.fbt-in p:not(.eyebrow){color:var(--band-soft);margin:10px 0 20px;max-width:42ch}
.fbt-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.fbt-chips span{border:1.5px solid var(--band-line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14.5px;color:var(--band-ink)}
.fbt-chips span.on{background:var(--band-hi);border-color:var(--band-hi);color:#2A1670}
@media (prefers-reduced-motion:no-preference){.fbt-chips span.on{animation:bob 3s ease-in-out infinite}.fbt-chips span.on+span+span.on{animation-delay:-1.5s}@keyframes bob{50%{transform:translateY(-4px)}}}

@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:6px}
  .st-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}
  .check{padding-top:48px}
  .check-grid,.rf-grid,.ms-grid,.fbt-in{grid-template-columns:minmax(0,1fr);gap:28px}
  .proc,.proof{position:static}
  .psteps{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
  .psteps li{grid-template-columns:1fr;justify-items:center;text-align:center;gap:8px}
  .psteps li:not(:last-child)::after{left:calc(50% + 34px);top:30px;height:0;width:calc(100% - 60px);border-left:0;border-top:2px dashed var(--line)}
  .pic{width:58px;height:58px;border-radius:18px}
  .pic svg{width:36px;height:36px}
  .pl{font-size:12.5px}
  .phint{display:none}
  .ms-form{grid-template-columns:minmax(0,1fr)}
  .fbt-chips{justify-content:flex-start}
  .fbt-in{padding:24px}
}
@media (max-width:420px){.st-grid{grid-template-columns:minmax(0,1fr)}}

/* hero scene: 12s loop of a pharmacy counter. Story: overcharged, check, refund. */
.scene{margin:0;position:relative}
.stage{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:20px;overflow:hidden;border:2px solid var(--ink);box-shadow:var(--shadow);container-type:inline-size;background:var(--rxbg)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .ani{--d:12s;animation-duration:var(--d);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.cust{animation-name:sc-walk}
.m-flat{animation-name:sc-flat}.m-smile{animation-name:sc-smile;opacity:0}
.cash1{animation-name:sc-cash1;opacity:0}.cash2{animation-name:sc-cash2;opacity:0}
.hphone{animation-name:sc-hphone;opacity:0}.okb{animation-name:sc-ok;opacity:0;transform-box:fill-box;transform-origin:center}
.bub{position:absolute;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:.35em .7em;font-family:var(--display);font-weight:800;font-size:15px;font-size:clamp(11px,3.4cqw,17px);line-height:1.2;opacity:0;transform-origin:85% 100%;box-shadow:0 6px 14px -8px rgba(20,10,60,.5)}
.bub::after{content:"";position:absolute;right:22%;bottom:-8px;width:12px;height:12px;background:var(--panel);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.b1{left:56%;top:13%;font-size:clamp(14px,4.6cqw,24px);animation-name:sc-b1}
.b3{right:3%;top:7%;max-width:46%;animation-name:sc-b3}
.dim{position:absolute;inset:0;background:#120B2A;opacity:0;animation-name:sc-dim}
.sphone{position:absolute;left:50%;top:5%;width:46%;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:6% 5% 5%;padding:3cqw 2.6cqw 2.6cqw;display:grid;gap:1.4cqw;opacity:0;animation-name:sc-phone;font-size:12px;font-size:clamp(9px,2.8cqw,14px)}
.sphone::before{content:"";position:absolute;top:1.1cqw;left:50%;width:18%;height:.9cqw;min-height:3px;border-radius:9px;background:var(--line);transform:translateX(-50%)}
.sp-wm{font-family:var(--mark);font-weight:800;letter-spacing:-.04em;font-size:1.25em}
.sp-name{font-weight:700;border-bottom:1px dashed var(--line);padding-bottom:1cqw}
.sp-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:var(--soft)}
.sp-row b{font-family:var(--display);font-weight:800;color:var(--ink);font-size:1.35em;white-space:nowrap}
.sp-row.good b{color:var(--rx)}
.sp-row.bad b{color:var(--red)}
.sp-stamp{justify-self:center;margin-top:.6cqw;font-family:var(--display);font-weight:800;color:var(--red);border:3px double var(--red);border-radius:8px;padding:.25em .6em;font-size:1.15em;white-space:nowrap;opacity:0;animation-name:sc-stamp}
.sc-cap{position:absolute;left:0;right:0;bottom:0;height:29%;display:grid;align-items:center;padding:0 16% 0 4%;pointer-events:none}
.sc-cap>span{grid-area:1/1;display:flex;gap:.6em;align-items:center;font-weight:700;font-size:13px;font-size:clamp(12px,3.3cqw,16.5px);line-height:1.3;color:var(--ink);opacity:0}
.sc-cap>span>b{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--rx);color:#fff;font-size:.85em}
.c1{animation-name:sc-c1}.c2{animation-name:sc-c2}.c3{animation-name:sc-c3}
.sc-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--or);transform-origin:0 50%;animation:sc-bar var(--d,12s) linear infinite}
.sc-pp{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0;z-index:3}
.scene.paused .ani,.scene.paused .sc-bar{animation-play-state:paused}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes sc-walk{0%{transform:translateX(-170px);opacity:0}3%{opacity:1}9%,96%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes sc-flat{0%,84%{opacity:1}86%,100%{opacity:0}}
@keyframes sc-smile{0%,84%{opacity:0}86%,96%{opacity:1}100%{opacity:0}}
@keyframes sc-b1{0%,10%{opacity:0;transform:scale(.6)}13%,36%{opacity:1;transform:scale(1)}40%,100%{opacity:0;transform:scale(.6)}}
@keyframes sc-cash1{0%,20%{opacity:0;transform:translate(0,0)}23%{opacity:1;transform:translate(0,0)}35%{opacity:1;transform:translate(150px,-4px)}39%,100%{opacity:0;transform:translate(150px,-4px)}}
@keyframes sc-dim{0%,41%{opacity:0}46%,68%{opacity:.4}72%,100%{opacity:0}}
@keyframes sc-phone{0%,41%{opacity:0;transform:translate(-50%,12%) scale(.7)}46%,68%{opacity:1;transform:translate(-50%,0) scale(1)}72%,100%{opacity:0;transform:translate(-120%,40%) scale(.3)}}
@keyframes sc-stamp{0%,51%{opacity:0;transform:rotate(-8deg) scale(1.9)}55%,68%{opacity:1;transform:rotate(-8deg) scale(1)}72%,100%{opacity:0;transform:rotate(-8deg)}}
@keyframes sc-hphone{0%,70%{opacity:0}73%,96%{opacity:1}100%{opacity:0}}
@keyframes sc-b3{0%,75%{opacity:0;transform:scale(.6)}78%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes sc-cash2{0%,79%{opacity:0;transform:translate(0,0)}81%{opacity:1;transform:translate(0,0)}90%{opacity:1;transform:translate(-150px,-4px)}94%,100%{opacity:0;transform:translate(-150px,-4px)}}
@keyframes sc-ok{0%,88%{opacity:0;transform:scale(.3)}91%,97%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes sc-c1{0%,1%{opacity:0}4%,38%{opacity:1}41%,100%{opacity:0}}
@keyframes sc-c2{0%,41%{opacity:0}44%,69%{opacity:1}72%,100%{opacity:0}}
@keyframes sc-c3{0%,72%{opacity:0}75%,97%{opacity:1}100%{opacity:0}}
@keyframes sc-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .stage .ani,.sc-bar{animation:none!important}
  .sc-pp{display:none}
  .sphone{opacity:1;transform:translate(-50%,0)}
  .sp-stamp{opacity:1;transform:rotate(-8deg)}
  .dim{opacity:.4}
  .c2{opacity:1}
}
/* capsule switch */
.capsule{display:grid;grid-template-columns:1fr 1fr;border-radius:999px;overflow:hidden;border:2px solid var(--ink);margin-bottom:18px;box-shadow:var(--shadow)}
.capsule button{border:0;padding:13px 10px;font-family:var(--display);font-weight:750;font-size:17px;background:var(--panel);color:var(--soft);transition:background .2s,color .2s}
.capsule button[aria-selected="true"]{background:var(--rx);color:#fff}
:root[data-theme="dark"] .capsule button[aria-selected="true"]{color:#120B2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .capsule button[aria-selected="true"]{color:#120B2A}}
.capsule button+button{border-left:2px solid var(--ink)}

/* carton */
.carton{background:var(--panel);border-radius:4px 4px 18px 18px;box-shadow:var(--shadow);position:relative;overflow:visible}
.carton::before{content:"";display:block;height:14px;border-radius:4px 4px 0 0;background:linear-gradient(90deg,var(--rx) 0 62%,var(--or) 62% 100%)}
.cbody{padding:20px 20px 22px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.chead h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.02em;margin:0}
.chead small{display:block;font-size:13.5px;color:var(--soft);margin-top:4px;font-family:var(--sans)}
.rx{font-family:var(--display);font-weight:800;font-size:22px;color:var(--rx);border:2px solid var(--rx);border-radius:8px;padding:0 7px;line-height:1.35}
.perf{height:0;border-top:2px dashed var(--line);margin:0 -20px 16px}
.strip{position:relative;border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;background:repeating-linear-gradient(0deg,transparent 0 30px,rgba(35,48,143,.035) 30px 31px);overflow:hidden}
.row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;padding:8px 0}
.row+.row{border-top:1px dashed var(--line)}
.row label{font-family:var(--sans);font-weight:600;color:var(--soft);font-size:14px}
.row input{border:0;background:transparent;width:100%;min-width:0;padding:6px 0;outline:none}
.row input.dot{font-family:var(--dot);font-size:24px;color:var(--ink-dot);letter-spacing:.08em;text-transform:uppercase}
.row input.txt{font-size:18px}
.row input::placeholder{color:var(--soft);opacity:.55}
.strip:focus-within{border-color:var(--ink-dot)}

.or{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px;margin:0 0 12px}

/* autocomplete */
function autocomplete(input,list,source,onPick){
  let idx=-1,items=[];
  const close=()=>{list.classList.remove("on");input.setAttribute("aria-expanded","false");idx=-1};
  input.addEventListener("input",()=>{
    const q=low(input.value);if(q.length<2){close();return}
    const st=[],ct=[];
    for(const n of source){const l=low(n);if(l.startsWith(q))st.push(n);else if(ct.length<20&&l.includes(q))ct.push(n);if(st.length>=8)break}
    items=[...st,...ct].slice(0,7);
    if(!items.length){close();return}
    list.innerHTML=items.map((n,i)=>`<button type="button" role="option" id="${list.id}-${i}" aria-selected="false">${esc(n)}</button>`).join("");
    list.classList.add("on");input.setAttribute("aria-expanded","true");
    list.querySelectorAll("button").forEach((b,i)=>b.onmousedown=e=>{e.preventDefault();input.value=items[i];close();onPick&&onPick()});
  });
  input.addEventListener("keydown",e=>{
    if(!list.classList.contains("on"))return;
    const bs=list.querySelectorAll("button");
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();idx=(idx+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.setAttribute("aria-selected",i===idx));input.setAttribute("aria-activedescendant",bs[idx].id)}
    else if(e.key==="Enter"&&idx>=0){e.preventDefault();e.stopImmediatePropagation();input.value=items[idx];close();onPick&&onPick()}
    else if(e.key==="Escape")close();
  });
  input.addEventListener("blur",()=>setTimeout(close,120));
}

function runBatch(silent){
  state="b";
  const qbRaw=$("qb").value.trim(),qb=norm(qbRaw),qnRaw=$("qn").value.trim(),qn=low(qnRaw),out=$("res");
  if(!qb&&qn.length<3){out.innerHTML=verdict("v-amber","!",T[L].needInput,T[L].needInputP);hideStamp();return}
  const words=qn?qn.split(" "):[];
  const nameHit=a=>words.every(w=>a._n.includes(w));
  let exact=[],close=[];
  if(qb){ALERTS.forEach(a=>{if(a._b.some(x=>x===qb))exact.push(a);else if(qb.length>=5&&a._b.some(x=>x.length>=5&&(x.includes(qb)||qb.includes(x))))close.push(a)});
    if(qn){const e2=exact.filter(nameHit);if(e2.length)exact=e2;close=close.filter(nameHit)}}
  const byName=qn.length>=3?ALERTS.filter(nameHit):[];
  const label=[qnRaw,qbRaw&&("batch "+qbRaw)].filter(Boolean).join(", ");
  const render=()=>{
    let h,st;
    if(exact.length){h=verdict("v-red","!",T[L].hitTitle,T[L].hitBody,actions("batch",T[L].draftBatch.replace("__N__",exact[0].p).replace("__B__",exact[0].b||qbRaw).replace("__K__",T[L].kind[exact[0].k]).replace("__D__",fmtDate(exact[0].d)).replace("__T__",today()),`⚠️ ${label}: ${T[L].hitTitle}. ${T[L].kind[exact[0].k]} (${fmtDate(exact[0].d)})`))+exact.map(alertCard).join("");st=["red",T[L].stampHit]}
    else if(close.length){h=verdict("v-amber","?",T[L].closeTitle,T[L].closeBody)+close.slice(0,10).map(alertCard).join("");st=["amber",T[L].stampClose]}
    else if(qb&&byName.length){h=verdict("v-amber","?",T[L].nameTitle,T[L].nameBody)+byName.slice(0,15).map(alertCard).join("");st=["green",T[L].stampClear]}
    else if(!qb&&byName.length){h=verdict("v-amber","i",T[L].nameOnlyTitle,T[L].nameOnlyBody)+byName.slice(0,15).map(alertCard).join("");st=null}
    else{h=verdict("v-green","✓",T[L].clearTitle,fill(T[L].clearBody));st=qb?["green",T[L].stampClear]:null}
    out.innerHTML=h; st?showStamp(st[0],st[1]):hideStamp();
    step("b",exact.length?4:3);
    if(!silent)DC.track("batch_check",{result:exact.length?"alert":close.length?"close_match":byName.length?"name_only":"clear",medicine:qnRaw.slice(0,80)});
  };
  if(silent){render();return}
  const strip=$("stripB");strip.classList.remove("scanning");void strip.offsetWidth;strip.classList.add("scanning");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{strip.classList.remove("scanning");render();if(innerWidth<860)out.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"})},reduce?0:650);
}

const ficon=(f,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${ICON[f]||ICON.other}</svg>`;
function formOf(r){
  const t=(r[0]+" "+r[1]+" "+r[3]).toLowerCase();
  if(/inhal|respule|rotacap|evohaler|accuhaler|nebul/.test(t))return"inhaler";
  if(/inj|vial|ampoul|infusion|\bi\.?v\b|prefilled|pre-filled|syringe/.test(t))return"inj";
  if(/drop/.test(t))return"drops";
  if(/syrup|susp|elixir|linctus|liquid|oral sol|solution|dry powder for|\bml\b/.test(t))return"syrup";
  if(/cream|ointment|\boint\b|\bgel\b|lotion|paste|\bspray\b/.test(t))return"cream";
  if(/sachet|granule|powder/.test(t))return"sachet";
  if(/caps|capsule|\bcap\b/.test(t))return"capsule";
  if(/tab|caplet|\bdt\b/.test(t))return"tablet";
  return"other";
}
const STR=/\d+(?:\.\d+)?\s*(?:mg|mcg|µg|g|ml|iu|%)(?:\s*\/\s*\d*\s*(?:ml|g))?/i;
function baseOf(b){
  let s=b.replace(/[®™]/g,"").replace(/\(.*?\)/g," ");
  s=s.replace(/\s*\d+(?:\.\d+)?\s*(?:mg|mcg|µg|g|ml|iu|%)\b.*$/i,"");
  s=s.replace(/\s(?:tablets?|tabs?|caplets?|capsules?|caps?|syrup|suspension|susp|elixir|drops?|injection|inj|infusion|cream|ointment|gel|lotion|sachets?|granules|powder|ds|forte|plus|xr|sr|er|mr|cr|dt|extra|extend|max|kids?|junior|pediatric|paediatric|liquid|retard|i\.?v\.?|\d+)(?:\b|\s|$).*$/i,"");
  s=s.replace(/[-.,]+$/,"").trim();
  return s||b.split(/\s+/)[0];
}
const tcase=s=>s.toLowerCase().replace(/(^|\s|-)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function variantLabel(r,base){
  let rest=r[0].replace(/[®™]/g,"");
  const i=rest.toLowerCase().indexOf(base.toLowerCase());
  if(i>=0)rest=rest.slice(i+base.length);
  rest=rest.replace(/^[\s\-–,.]+/,"").trim();
  rest=rest&&rest===rest.toUpperCase()?tcase(rest):rest;
  if(!STR.test(rest)){const all=(r[1]||"").match(new RegExp(STR.source,"gi"))||[];const m=all.find(x=>!/ml$/i.test(x.trim()))||all[0];if(m)rest=(rest?rest+" ":"")+m.replace(/\s+/g,"")}
  rest=rest.charAt(0).toUpperCase()+rest.slice(1);
  rest=rest.replace(/\b(ds|xr|sr|cr|mr|er|dt|iv|i\.v\.)\b/gi,x=>x.toUpperCase());
  return rest||T[L].standard;
}
function runPrice(silent){
  state="p";hideStamp();

  if(q.length<3){out.innerHTML=verdict("v-amber","!",T[L].needInput,"");return}
  const w=q.split(" ");
  const rows=PRICES.filter(r=>w.every(x=>r._n.includes(x)));
  if(!silent)DC.track("price_search",{term:q.slice(0,80),results:rows.length});
  if(!rows.length){out.innerHTML=verdict("v-amber","i",T[L].priceNone,T[L].priceNoneBody)+mrpBox();wireMrp();step("p",3);return}
  step("p",2);
  const gm=new Map();
  for(const r of rows){
    const base=baseOf(r[0]),key=low(base)+"|"+low(r[2]).replace(/\b(pvt|private|ltd|limited|pakistan|pak)\b/g,"").replace(/\s+/g," ").trim();
    if(!gm.has(key))gm.set(key,{base,maker:r[2],vars:new Map()});
    const g=gm.get(key),vk=low(r[0])+"|"+low(r[1]);
    if(!g.vars.has(vk))g.vars.set(vk,{label:variantLabel(r,base),form:formOf(r),comp:r[1],rows:[]});
    g.vars.get(vk).rows.push(r);
  }
  groups=[...gm.values()].map(g=>{
    const vars=[...g.vars.values()];
    vars.forEach(v=>v.rows.sort((a,b)=>a[4]-b[4]));
    vars.sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}));
    const forms=[...new Set(vars.map(v=>v.form))];
    return{base:g.base,maker:g.maker,vars,form:forms[0],sel:0};
  });
  groups.sort((a,b)=>(low(a.base).startsWith(w[0])?0:1)-(low(b.base).startsWith(w[0])?0:1)||b.vars.length-a.vars.length||a.base.localeCompare(b.base));
  groups=groups.slice(0,15);

  out.innerHTML=`<p class="meta" style="margin:0">${T[L].pickPack}</p><div class="groups">${groups.map((g,gi)=>`
   <article class="grp"><div class="g-head"><span class="g-ic">${ficon(g.form,30)}</span><span class="g-nm"><b>${esc(tcase(g.base))}</b><small>${esc(g.maker)}</small></span><span class="g-ct">${g.vars.length} ${g.vars.length>1?T[L].variants:T[L].variant}</span></div>
   <div class="vchips" role="group" aria-label="${T[L].chooseVar}">${g.vars.map((v,vi)=>`<button class="vchip" data-g="${gi}" data-v="${vi}" aria-pressed="${vi===0}">${ficon(v.form,18)}<span>${esc(v.label)}</span></button>`).join("")}</div>
   <div class="packs" id="packs${gi}"></div></article>`).join("")}</div>`;
  groups.forEach((g,gi)=>renderPacks(gi,0));
  out.querySelectorAll(".vchip").forEach(b=>b.onclick=()=>{const gi=+b.dataset.g,vi=+b.dataset.v;out.querySelectorAll(`.vchip[data-g="${gi}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));renderPacks(gi,vi)});
  out.insertAdjacentHTML("beforeend",`<button class="chip" id="notListed" style="justify-self:start">${T[L].notListed}</button><div id="mrpWrap"></div>`);
  $("notListed").onclick=()=>{out.querySelectorAll(".pay").forEach(x=>{x.classList.add("hidden");x.innerHTML=""});out.querySelectorAll(".pack").forEach(x=>x.setAttribute("aria-pressed","false"));$("mrpWrap").innerHTML=verdict("v-amber","i",T[L].priceNone,T[L].priceNoneBody)+mrpBox();wireMrp();$("mrp").focus()};
}
function renderPacks(gi,vi){
  const v=groups[gi].vars[vi],box=$("packs"+gi);
  box.innerHTML=(v.comp?`<p class="comp">${esc(v.comp.slice(0,110))}</p>`:"")+v.rows.map(r=>{const i=hits.push(r)-1;return`<div><button class="pack" data-i="${i}" aria-pressed="false"><span class="cell">${ficon(v.form,26)}</span><span class="nm"><b>${esc(r[3]||T[L].pack)}</b><small>${T[L].regNo} ${esc(r[6])} · ${T[L].since.replace("__D__",esc(r[5]))}</small></span><span class="sticker">Rs ${rs(r[4])}</span></button><div class="pay hidden" id="pay${i}"></div></div>`}).join("");
  box.querySelectorAll(".pack").forEach(b=>b.onclick=()=>openPay(+b.dataset.i));
}
function mrpBox(){return `<div class="paybox"><label for="mrp" class="meta" style="display:block;margin:0 0 6px">${T[L].mrpLbl}</label><div class="payrow"><span>Rs</span><input id="mrp" inputmode="decimal" autocomplete="off" placeholder="0"></div><label for="mpaid" class="meta" style="display:block;margin:16px 0 6px">${T[L].paidLbl}</label><div class="payrow"><span>Rs</span><input id="mpaid" inputmode="decimal" autocomplete="off" placeholder="0"></div><div id="mmeter"></div><div id="mout"></div></div>`}
function wireMrp(){
  const go=()=>{const m=parseFloat($("mrp").value.replace(/[^0-9.]/g,"")),v=parseFloat($("mpaid").value.replace(/[^0-9.]/g,"")),o=$("mout"),mt=$("mmeter");
    if(!(m>0)||!(v>0)){o.innerHTML="";mt.innerHTML="";return}
    step("p",4);
    const max=Math.max(v,m)*1.25;
    mt.innerHTML=`<div class="meter" style="--lim:${m/max*100}%;--pos:${Math.min(v/max*100,100)}%"><span class="pin"></span></div><div class="meter-l"><span>Rs 0</span><span>${T[L].limit}: Rs ${rs(m)}</span></div>`;
    o.innerHTML=v>m+0.5?`<div style="margin-top:14px">${verdict("v-red","!",T[L].mrpOver.replace("__X__",rs(v-m)),T[L].mrpOverBody.replace("__M__",rs(m)),actions("price",T[L].draftPrice.replace("__N__",$("qp").value).replace("__V__",rs(v)).replace("__M__",rs(m)).replace("__S__",T[L].printedOnBox).replace("__T__",today()),T[L].shareM.replace("__N__",$("qp").value).replace("__M__",rs(m)).replace("__V__",rs(v))))}</div>`:`<div style="margin-top:14px">${verdict("v-green","✓",T[L].mrpOk,T[L].mrpOkBody.replace("__M__",rs(m)))}</div>`};
  $("mrp").addEventListener("input",go);$("mpaid").addEventListener("input",go);
}
function openPay(i){
  const out=$("res");
  out.querySelectorAll(".pack").forEach(x=>x.setAttribute("aria-pressed",x.dataset.i==i));
  out.querySelectorAll(".pay").forEach(x=>{x.classList.add("hidden");x.innerHTML=""});
  const r=hits[i],box=$("pay"+i);box.classList.remove("hidden");step("p",3);
  box.innerHTML=`<div class="paybox"><label for="pv" class="meta" style="display:block;margin:0 0 6px">${T[L].paidLbl}</label><div class="payrow"><span>Rs</span><input id="pv" inputmode="decimal" autocomplete="off" placeholder="0"></div><div id="pmeter"></div><div id="pv-out"></div></div>`;
  const inp=$("pv");inp.focus();
  inp.addEventListener("change",()=>{const v=parseFloat(inp.value.replace(/[^0-9.]/g,""));if(v>0)DC.track("price_compare",{medicine:r[0].slice(0,80),pack:r[3],overcharged:v>r[4]+0.5,over_by:Math.max(0,Math.round(v-r[4]))})});
  inp.addEventListener("input",()=>{
    const v=parseFloat(inp.value.replace(/[^0-9.]/g,"")),o=$("pv-out"),m=$("pmeter");
    if(isNaN(v)||v<=0){o.innerHTML="";m.innerHTML="";step("p",3);return}
    step("p",4);
    const max=Math.max(v,r[4])*1.25,lim=r[4]/max*100,pos=Math.min(v/max*100,100);
    m.innerHTML=`<div class="meter" style="--lim:${lim}%;--pos:${pos}%"><span class="pin"></span></div><div class="meter-l"><span>Rs 0</span><span>${T[L].limit}: Rs ${rs(r[4])}</span></div>`;
    const md=r[5];
    o.innerHTML=v>r[4]+0.5
      ?`<div style="margin-top:14px">${verdict("v-red","!",T[L].over.replace("__X__",rs(v-r[4])),T[L].overBody.replace("__M__",rs(r[4])).replace("__D__",md),actions("price",T[L].draftPrice.replace("__N__",r[0]+" ("+r[3]+")").replace("__V__",rs(v)).replace("__M__",rs(r[4])).replace("__S__","DRAP ("+md+")").replace("__T__",today()),T[L].shareP.replace("__N__",r[0]+" ("+r[3]+")").replace("__M__",rs(r[4])).replace("__V__",rs(v))))}</div>`
      :`<div style="margin-top:14px">${verdict("v-green","✓",T[L].ok,T[L].okBody.replace("__M__",rs(r[4])).replace("__D__",md))}</div>`;
  });
}
$("goP").onclick=()=>runPrice();
$("qp").addEventListener("keydown",e=>{if(e.key==="Enter")runPrice()});
$("qp").addEventListener("input",()=>{if(state!=="p")step("p",1)});
document.querySelectorAll("[data-px]").forEach(c=>c.onclick=()=>{$("qp").value=c.dataset.px;runPrice()});

/* shelf of latest fakes */
function renderShelf(){
  const seen=new Set(),pick=[];
  for(const a of ALERTS){if(a.k!=="fake"||!a.b)continue;const k=short(a.p);if(seen.has(k))continue;seen.add(k);pick.push(a);if(pick.length>=10)break}
  $("shelf").innerHTML=pick.map((a,i)=>`<button class="box" data-s="${i}"><span class="tape">${esc(T[L].kind.fake.toUpperCase())}</span><b>${esc(short(a.p))}</b><span class="bn">B.No ${esc(a.b)}</span><small>${fmtDate(a.d)}</small><span class="go">${T[L].tapCheck} →</span></button>`).join("");
  $("shelf").querySelectorAll(".box").forEach(b=>b.onclick=()=>{const a=pick[+b.dataset.s];setTab("b");$("qn").value=short(a.p);$("qb").value=a.b;$("tool").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>runBatch(),350)});
}
/* ---------- home screen install ---------- */
(()=>{
  const bar=$("install"),btn=$("instBtn"),ios=$("iosHelp");
  const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(!inFrame&&"serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(inFrame||standalone)return;
  let snoozed=false;try{snoozed=Date.now()<+(localStorage.getItem("dc-install-snooze")||0)}catch(e){}
  if(snoozed)return;
  let deferred=null;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const show=()=>bar.classList.remove("hidden");
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show()});
  if(isIOS)setTimeout(show,1500);
  btn.onclick=async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;bar.classList.add("hidden")}
    else ios.classList.toggle("hidden");
  };
  $("instX").onclick=()=>{bar.classList.add("hidden");try{localStorage.setItem("dc-install-snooze",String(Date.now()+14*864e5))}catch(e){}};
  window.addEventListener("appinstalled",()=>bar.classList.add("hidden"));
})();

/* missing medicine form */
$("msForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target,out=$("msOut"),btn=$("msSend"),name=$("f-name");
  if(f._honey.value)return;
  if(!name.value.trim()){name.setAttribute("aria-invalid","true");name.focus();out.innerHTML=`<p class="meta" style="color:var(--red);margin:0">${esc(T[L].errName)}</p>`;return}
  name.removeAttribute("aria-invalid");
  const v=id=>$(id).value.trim();
  const data={medicine:v("f-name"),strength:v("f-str"),pack:v("f-pack"),mrp:v("f-mrp"),company:v("f-co"),city:v("f-city"),email:v("f-email"),note:v("f-note"),language:L==="en"?"English":"Roman Urdu"};
  btn.disabled=true;btn.textContent=T[L].fSending;
  const ok=await DC.send("Missing medicine: "+data.medicine,data);
  btn.disabled=false;btn.textContent=T[L].fSend;
  if(ok){
    out.innerHTML=`<div class="sent"><span class="ic" aria-hidden="true">✓</span><div><b>${esc(T[L].okH)}</b><p>${esc(T[L].okP)}</p></div></div>`;
    f.reset();DC.track("missing_medicine_submit",{medicine:data.medicine.slice(0,80)});
  }else{
    const txt=Object.entries(data).filter(([k,x])=>x).map(([k,x])=>k+": "+x).join("\n");
    out.innerHTML=verdict("v-amber","!",T[L].errSend,"",`<div class="draft"><textarea rows="5" aria-label="${esc(T[L].copy)}">${esc(txt)}</textarea><button type="button" class="copy">${esc(T[L].copy)}</button></div>`);
  }
});

/* hero scene: pause button, and pause while off screen */
(()=>{
  const sc=$("scene"),pp=$("scPP");let manual=false;
  const label=()=>{const p=sc.classList.contains("paused");pp.setAttribute("aria-label",p?T[L].scPlay:T[L].scPause);pp.setAttribute("aria-pressed",p);pp.querySelector(".i-play").classList.toggle("hidden",!p);pp.querySelector(".i-pause").classList.toggle("hidden",p)};
  pp.onclick=()=>{manual=!sc.classList.contains("paused");sc.classList.toggle("paused",manual);label();DC.track("scene_toggle",{paused:manual})};
  if("IntersectionObserver" in window)new IntersectionObserver(es=>{if(!manual)sc.classList.toggle("paused",!es[0].isIntersecting);label()}).observe(sc);
  window.sceneLabel=label;label();
})();
applyLang();
fromHash();
</script>
