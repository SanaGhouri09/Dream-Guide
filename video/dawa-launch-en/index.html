<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dawa Check launch (English)</title>
<style>
  /* Display: Plus Jakarta Sans 800 (the site's headings). UI: Plus Jakarta Sans 500-700.
     Mark: Bricolage Grotesque 800, used only for the dawacheck wordmark (the logo). */
  @font-face { font-family: Display; src: url(fonts/display.ttf) format('truetype'); font-weight: 800; }
  @font-face { font-family: UI; src: url(fonts/ui-500.ttf) format('truetype'); font-weight: 500; }
  @font-face { font-family: UI; src: url(fonts/ui-600.ttf) format('truetype'); font-weight: 600; }
  @font-face { font-family: UI; src: url(fonts/ui-700.ttf) format('truetype'); font-weight: 700; }
  @font-face { font-family: Mark; src: url(fonts/mark.ttf) format('truetype'); font-weight: 800; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="../dawa-launch/film.js"></script>
</body>
</html>
